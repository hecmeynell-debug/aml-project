[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml"
version = "0.1.0"
description = "Anti-money laundering analytics on the IBM synthetic transactions dataset"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
